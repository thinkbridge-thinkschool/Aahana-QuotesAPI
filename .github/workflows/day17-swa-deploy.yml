name: Day 17 - Deploy Angular frontend to Azure Static Web Apps

on:
  push:
    branches:
      - day17-swa-deploy
    paths:
      - "Day15/Day15App/**"
      - "Day17/api/**"
      - ".github/workflows/day17-swa-deploy.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths:
      - "Day15/Day15App/**"
      - "Day17/api/**"

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # QUOTES_API_BASE_URL and QUOTES_API_ENTRA_AUDIENCE are repo/environment
      # variables, not secrets - they are the API's public base URL and the
      # Entra app registration's App ID URI, neither of which is a credential.
      - name: Inject the deployed QuotesApi URL into the production config
        env:
          QUOTES_API_BASE_URL: ${{ vars.QUOTES_API_BASE_URL }}
        run: |
          sed -i "s#https://REPLACE-WITH-QUOTES-API-URL#${QUOTES_API_BASE_URL}#" \
            Day15/Day15App/src/environments/environment.prod.ts

      - name: Build and deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "Day15/Day15App"
          api_location: "Day17/api"
          output_location: "dist/Day15App/browser"

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close pull request
    steps:
      - name: Close pull request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
