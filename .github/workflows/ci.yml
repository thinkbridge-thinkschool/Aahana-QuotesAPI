name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Install dotnet-coverage
        run: dotnet tool install --global dotnet-coverage

      - name: Add dotnet tools to PATH
        run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Test Domain
        run: >
          dotnet-coverage collect
          "dotnet test ./Tests.Domain/Tests.Domain.csproj --no-build"
          -f cobertura
          -o ./TestResults/domain-coverage.xml

      - name: Test API
        run: >
          dotnet-coverage collect
          "dotnet test ./QuotesApi.Tests/QuotesApi.Tests.csproj --no-build"
          -f cobertura
          -o ./TestResults/api-coverage.xml

      - name: Test Integration
        run: >
          dotnet-coverage collect
          "dotnet test ./Quotes.Tests.Integration/Quotes.Tests.Integration.csproj --no-build"
          -f cobertura
          -o ./TestResults/integration-coverage.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/**/*.trx'
          if-no-files-found: warn

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: './TestResults/*.xml'
          if-no-files-found: error

      - name: Check coverage
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          files = glob.glob("TestResults/*-coverage.xml")

          if not files:
              print("No coverage file found.")
              sys.exit(1)

          total_lines = 0
          total_covered = 0

          for file in files:
              print(f"Reading coverage: {file}")

              root = ET.parse(file).getroot()

              file_lines = 0
              file_covered = 0

              for line in root.findall(".//line"):
                  file_lines += 1

                  if int(line.attrib.get("hits", "0")) > 0:
                      file_covered += 1

              print(f"  Lines: {file_covered}/{file_lines}")

              total_lines += file_lines
              total_covered += file_covered

          if total_lines == 0:
              print("Coverage contains no executable lines.")
              sys.exit(1)

          coverage = (total_covered / total_lines) * 100

          print(f"Total line coverage: {coverage:.2f}%")
          print("Required minimum: 70%")

          if coverage < 70:
              print("Coverage is below 70%.")
              sys.exit(1)

          print("Coverage requirement passed.")
          PY